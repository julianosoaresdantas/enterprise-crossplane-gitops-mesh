apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-idp
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://codecentric.github.io/helm-charts'
    chart: keycloak
    targetRevision: 18.4.4
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
